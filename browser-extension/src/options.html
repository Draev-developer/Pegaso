<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Pegaso</title>
<link rel="stylesheet" href="pages.css">
</head>
<body class="options">
  <main>
    <header>
      <img src="icons/icon-128.png" alt="" width="48" height="48">
      <div>
        <div class="title big">Pegaso</div>
        <div class="muted" data-i18n="description"></div>
      </div>
    </header>

    <h2 data-i18n="stepsTitle"></h2>
    <ol>
      <li data-i18n="step1"></li>
      <li data-i18n="step2"></li>
      <li data-i18n="step3"></li>
    </ol>

    <form id="form">
      <label for="token" data-i18n="key"></label>
      <input id="token" type="password" autocomplete="off" spellcheck="false">
      <label for="port" data-i18n="port"></label>
      <input id="port" type="number" min="1" max="65535">
      <label class="check"><input id="capture" type="checkbox"> <span data-i18n="capture"></span></label>
      <p class="muted small" data-i18n="captureHint"></p>
      <div class="buttons">
        <button type="submit" class="primary" data-i18n="saveAndTest"></button>
      </div>
      <div id="message" class="message" hidden></div>
    </form>

    <h2 data-i18n="useTitle"></h2>
    <ul class="plainlist">
      <li data-i18n="use1"></li>
      <li data-i18n="use2"></li>
      <li data-i18n="use3"></li>
    </ul>
    <p class="muted small" data-i18n="privacy"></p>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
